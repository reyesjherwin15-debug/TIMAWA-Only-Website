<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16233a">
  <title>TIMAWA — Offline</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101827; color: #f8fafc; }
    main { width: min(100%, 480px); padding: 30px; border: 1px solid #334155; border-radius: 24px; background: #1e293b; box-shadow: 0 20px 60px #02061780; }
    .mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(135deg,#0ea5e9,#6366f1); font-size: 25px; font-weight: 900; }
    h1 { margin: 18px 0 8px; font-size: 26px; }
    p { color: #cbd5e1; line-height: 1.55; }
    .actions { display: grid; gap: 10px; margin-top: 22px; }
    button { min-height: 48px; padding: 12px 16px; border: 0; border-radius: 13px; color: #fff; background: #2563eb; font: inherit; font-weight: 750; cursor: pointer; }
    button.secondary { color: #e2e8f0; background: #334155; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    small { display: block; margin-top: 18px; color: #94a3b8; }
    #status { min-height: 1.5em; color: #bae6fd; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">T</div>
    <h1>You're offline</h1>
    <p>TIMAWA can reopen a page previously saved on this device. Offline changes may not sync until the connection returns.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="openLast" type="button">Open last saved page</button>
      <button id="openHome" class="secondary" type="button">Open TIMAWA home</button>
      <button id="retry" class="secondary" type="button">Check connection</button>
    </div>
    <small>Only pages and data cached before you went offline are available.</small>
  </main>
  <script>
    (function () {
      'use strict';
      var status = document.getElementById('status');
      function localPage(value) {
        try {
          var target = new URL(value || './index.html', location.href);
          return target.origin === location.origin && target.pathname.startsWith(new URL('./', location.href).pathname) ? target.href : new URL('./index.html', location.href).href;
        } catch (_) { return new URL('./index.html', location.href).href; }
      }
      function go(target) { location.href = localPage(target); }
      document.getElementById('openLast').addEventListener('click', function () {
        var last = '';
        try { last = localStorage.getItem('timawa.lastPage') || ''; } catch (_) {}
        go(last || './dashboard.html');
      });
      document.getElementById('openHome').addEventListener('click', function () { go('./index.html'); });
      document.getElementById('retry').addEventListener('click', function () {
        if (navigator.onLine) { status.textContent = 'Connection detected. Opening TIMAWA…'; go('./index.html'); }
        else status.textContent = 'Still offline. You can open a page saved on this device.';
      });
      window.addEventListener('online', function () { status.textContent = 'Connection restored. Reopen TIMAWA to sync.'; });
    })();
  </script>
</body>
</html>
